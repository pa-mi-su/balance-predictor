# ==============================
# API Gateway Configuration
# ==============================

spring.application.name=api-gateway
server.port=8081

# ==============================
# Management / Actuator
# ==============================
management.server.port=8081
management.endpoints.web.exposure.include=health,info,gateway
management.endpoint.gateway.enabled=true
spring.cloud.gateway.actuator.verbose.enabled=true

# ==============================
# Eureka / Service Discovery
# ==============================
eureka.client.service-url.defaultZone=${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka}
eureka.instance.prefer-ip-address=true
eureka.client.healthcheck.enabled=true

# ==============================
# JWT / Resource Server
# ==============================
# Validate access tokens signed by Auth Service (RS256 + JWKS)
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${AUTH_JWKS_URI:http://auth-service:8084/oauth2/jwks}
spring.security.oauth2.resourceserver.jwt.issuer-uri=${AUTH_ISSUER:http://auth-service:8084}

# ==============================
# Spring Cloud Gateway
# ==============================
# Let the gateway discover downstream services from Eureka
spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true

# Explicit routes (clean /api facade)
spring.cloud.gateway.routes[0].id=balance
spring.cloud.gateway.routes[0].uri=lb://balance-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/balance/**

spring.cloud.gateway.routes[1].id=ledger
spring.cloud.gateway.routes[1].uri=lb://ledger-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/ledger/**

spring.cloud.gateway.routes[2].id=plaid
spring.cloud.gateway.routes[2].uri=lb://plaid-service
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/plaid/**

# Public auth endpoints (no JWT required)
spring.cloud.gateway.routes[3].id=auth
spring.cloud.gateway.routes[3].uri=lb://auth-service
spring.cloud.gateway.routes[3].predicates[0]=Path=/auth/**

# ==============================
# CORS (Development)
# ==============================
spring.cloud.gateway.globalcors.corsConfigurations.[/api/**].allowedOrigins=*
spring.cloud.gateway.globalcors.corsConfigurations.[/api/**].allowedMethods=GET,POST,PUT,DELETE,OPTIONS
spring.cloud.gateway.globalcors.corsConfigurations.[/api/**].allowedHeaders=*

# ==============================
# Notes
# ==============================
# - /auth/** routes bypass JWT so users can register/login
# - /api/** routes require valid Bearer JWT (validated via Auth Service JWKS)
# - The Gateway will inject X-User-Id header after auth (configured in AddUserIdHeaderFilter)
# - Downstream services also validate the JWT for defense-in-depth
