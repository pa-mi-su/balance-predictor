spring.application.name=plaid-service
server.port=8083

management.server.port=8083
management.endpoints.web.exposure.include=*

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

eureka.client.service-url.defaultZone=${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka}
eureka.instance.prefer-ip-address=true
eureka.client.healthcheck.enabled=true

# ------- Plaid config -------
# Primary (hyphenated) keys
plaid.env=${PLAID_ENV:sandbox}
plaid.base-url=${PLAID_BASE_URL:https://sandbox.plaid.com}
plaid.client-id=${PLAID_CLIENT_ID:}
plaid.secret=${PLAID_SECRET:}
plaid.webhook-url=${PLAID_WEBHOOK_URL:}

# Aliases so code using camelCase still works
plaid.clientId=${PLAID_CLIENT_ID:${plaid.client-id:}}
plaid.webhookUrl=${PLAID_WEBHOOK_URL:${plaid.webhook-url:}}
