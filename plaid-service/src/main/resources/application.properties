# ==============================
# Plaid Service Configuration
# ==============================
spring.application.name=plaid-service
server.port=8083

management.server.port=8083
management.endpoints.web.exposure.include=*

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# ==============================
# Eureka / Service Discovery
# ==============================
eureka.client.service-url.defaultZone=${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka}
eureka.instance.prefer-ip-address=true
eureka.client.healthcheck.enabled=true

# ==============================
# Plaid Sandbox / API Config
# ==============================
plaid.env=${PLAID_ENV:sandbox}
plaid.base-url=${PLAID_BASE_URL:https://sandbox.plaid.com}
plaid.client-id=${PLAID_CLIENT_ID:?PLAID_CLIENT_ID is required}
plaid.secret=${PLAID_SECRET:?PLAID_SECRET is required}
plaid.webhook-url=${PLAID_WEBHOOK_URL:}

# Aliases (backward compatibility with camelCase lookups)
plaid.clientId=${PLAID_CLIENT_ID:${plaid.client-id:}}
plaid.webhookUrl=${PLAID_WEBHOOK_URL:${plaid.webhook-url:}}

# ==============================
# Datasource (Postgres)
# ==============================
# Default to the Docker service host ("postgres") for compose; envs can override.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/bpdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:bpuser}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:bppass}
spring.datasource.hikari.maximum-pool-size=10

# ==============================
# JPA / Hibernate
# ==============================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.default_schema=public

# ==============================
# Flyway
# ==============================
spring.flyway.enabled=true
# Reuse datasource creds/URL
spring.flyway.url=${SPRING_FLYWAY_URL:${spring.datasource.url}}
spring.flyway.user=${SPRING_FLYWAY_USER:${spring.datasource.username}}
spring.flyway.password=${SPRING_FLYWAY_PASSWORD:${spring.datasource.password}}

# Service-local migrations + schema + dedicated history table
spring.flyway.locations=classpath:db/migration
spring.flyway.default-schema=public
spring.flyway.table=flyway_schema_history_plaid

# If your DB might already exist without a Flyway baseline, keep this true.
# For a brand-new DB, either value is fine; true is safest in shared dev DBs.
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true
