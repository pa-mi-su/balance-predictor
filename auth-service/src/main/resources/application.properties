spring.application.name=auth-service
server.port=8084

management.endpoints.web.exposure.include=health,info

# Eureka
eureka.client.service-url.defaultZone=${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka}
eureka.instance.prefer-ip-address=true
eureka.client.healthcheck.enabled=true

# Datasource (shared Postgres)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/bpdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:bpuser}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:bppass}

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.default-schema=public
spring.flyway.table=flyway_schema_history_auth
spring.flyway.validate-on-migrate=true
spring.flyway.baseline-on-migrate=true

# JWT / Issuer
auth.issuer=${AUTH_ISSUER:http://auth-service:8084}
# Option A: provide PEMs as env vars (recommended in compose)
auth.privateKeyPemBase64=${AUTH_PRIVATE_KEY_PEM_B64:}
auth.publicKeyPemBase64=${AUTH_PUBLIC_KEY_PEM_B64:}
# If not provided, keys are generated at startup (dev-only)

# Common across services
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${AUTH_JWKS_URI:http://auth-service:8084/oauth2/jwks}
spring.security.oauth2.resourceserver.jwt.issuer-uri=${AUTH_ISSUER:http://auth-service:8084}
