server.port=8761
spring.application.name=eureka-server

# This node is the registry (not a client of itself)
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false

# Optional niceties
eureka.instance.hostname=${EUREKA_HOST:localhost}
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

eureka.server.wait-time-in-ms-when-sync-empty=30000

# Common across services
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${AUTH_JWKS_URI:http://auth-service:8084/oauth2/jwks}
spring.security.oauth2.resourceserver.jwt.issuer-uri=${AUTH_ISSUER:http://auth-service:8084}
