services:
  # --- Service Discovery ---
  eureka-server:
    build:
      context: .
      dockerfile: eureka-server/Dockerfile
    image: eureka-server:local
    container_name: eureka-server
    ports:
      - "8761:8761"
    environment:
      SPRING_APPLICATION_NAME: eureka-server
      SERVER_PORT: 8761
      MANAGEMENT_SERVER_PORT: 8761
      EUREKA_CLIENT_REGISTER_WITH_EUREKA: "false"
      EUREKA_CLIENT_FETCH_REGISTRY: "false"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8761/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 15s
    restart: unless-stopped

  # --- Database (new) ---
  postgres:
    image: postgres:16-alpine
    container_name: bp-postgres
    environment:
      POSTGRES_DB: bpdb
      POSTGRES_USER: bpuser
      POSTGRES_PASSWORD: bppass
    ports:
      - "5432:5432" # optional for local tools
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bpuser -d bpdb"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # --- Core Services ---
  ledger-service:
    build:
      context: .
      dockerfile: ledger-service/Dockerfile
    image: ledger-service:local
    ports:
      - "8082:8082"
    environment:
      SPRING_APPLICATION_NAME: ledger-service
      SERVER_PORT: 8082
      MANAGEMENT_SERVER_PORT: 8082

      AUTH_ISSUER: http://auth-service:8084
      AUTH_JWKS_URI: http://auth-service:8084/oauth2/jwks

      # Eureka (your services read EUREKA_DEFAULT_ZONE in application.properties)
      EUREKA_DEFAULT_ZONE: http://eureka-server:8761/eureka

      # DB config (JPA + Flyway)
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/bpdb
      SPRING_DATASOURCE_USERNAME: bpuser
      SPRING_DATASOURCE_PASSWORD: bppass
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_JPA_SHOW_SQL: "false"
      SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: org.hibernate.dialect.PostgreSQLDialect
      SPRING_FLYWAY_ENABLED: "true"
      SPRING_FLYWAY_URL: jdbc:postgresql://postgres:5432/bpdb
      SPRING_FLYWAY_USER: bpuser
      SPRING_FLYWAY_PASSWORD: bppass
    depends_on:
      eureka-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8082/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s
    restart: unless-stopped

  plaid-service:
    build:
      context: .
      dockerfile: plaid-service/Dockerfile
    image: plaid-service:local
    container_name: plaid-service
    ports:
      - "8083:8083"
    environment:
      SPRING_APPLICATION_NAME: plaid-service
      SERVER_PORT: 8083
      MANAGEMENT_SERVER_PORT: 8083
      EUREKA_DEFAULT_ZONE: http://eureka-server:8761/eureka

      AUTH_ISSUER: http://auth-service:8084
      AUTH_JWKS_URI: http://auth-service:8084/oauth2/jwks

      # Plaid Sandbox credentials
      PLAID_ENV: ${PLAID_ENV}
      PLAID_CLIENT_ID: ${PLAID_CLIENT_ID}
      PLAID_SECRET: ${PLAID_SECRET}
      PLAID_WEBHOOK_URL: ${PLAID_WEBHOOK_URL}

      # --- Postgres + Flyway + JPA ---
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/bpdb
      SPRING_DATASOURCE_USERNAME: bpuser
      SPRING_DATASOURCE_PASSWORD: bppass
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_JPA_SHOW_SQL: "false"
      SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: org.hibernate.dialect.PostgreSQLDialect
      SPRING_FLYWAY_ENABLED: "true"
      SPRING_FLYWAY_URL: jdbc:postgresql://postgres:5432/bpdb
      SPRING_FLYWAY_USER: bpuser
      SPRING_FLYWAY_PASSWORD: bppass
      SPRING_FLYWAY_BASELINE_ON_MIGRATE: "true"

    depends_on:
      eureka-server:
        condition: service_healthy
      postgres:
        condition: service_healthy  # 👈 Added so Flyway waits until DB is ready

    healthcheck:
      test: [ "CMD", "curl", "-fsS", "http://localhost:8083/actuator/health" ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s
    restart: unless-stopped

  balance-service:
    build:
      context: .
      dockerfile: balance-service/Dockerfile
    image: balance-service:local
    ports:
      - "8080:8080"
    environment:
      SPRING_APPLICATION_NAME: balance-service
      SERVER_PORT: 8080
      MANAGEMENT_SERVER_PORT: 8080
      EUREKA_DEFAULT_ZONE: http://eureka-server:8761/eureka

      AUTH_ISSUER: http://auth-service:8084
      AUTH_JWKS_URI: http://auth-service:8084/oauth2/jwks
      # No LEDGER/PLAID base URLs — resolved via Eureka
    depends_on:
      eureka-server:
        condition: service_healthy
      ledger-service:
        condition: service_healthy
      plaid-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  # --- API Gateway ---
  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    image: api-gateway:local
    ports:
      - "8081:8081"
    environment:
      SPRING_APPLICATION_NAME: api-gateway
      SERVER_PORT: 8081
      MANAGEMENT_SERVER_PORT: 8081
      EUREKA_DEFAULT_ZONE: http://eureka-server:8761/eureka

      AUTH_ISSUER: http://auth-service:8084
      AUTH_JWKS_URI: http://auth-service:8084/oauth2/jwks
    depends_on:
      eureka-server:
        condition: service_healthy
      balance-service:
        condition: service_healthy
      ledger-service:
        condition: service_healthy
      plaid-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  auth-service:
    build:
      context: ./auth-service
    image: auth-service:local
    depends_on:
      - postgres
      - eureka-server
    environment:
      EUREKA_DEFAULT_ZONE: http://eureka-server:8761/eureka
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/bpdb
      SPRING_DATASOURCE_USERNAME: bpuser
      SPRING_DATASOURCE_PASSWORD: bppass
      AUTH_ISSUER: http://auth-service:8084
      # optional: provide stable keys for dev (base64 of PEMs)
      # AUTH_PRIVATE_KEY_PEM_B64: <paste>
      # AUTH_PUBLIC_KEY_PEM_B64:  <paste>
    ports:
      - "8084:8084"

networks:
  default:
    name: bpnet

volumes:
  pgdata:
