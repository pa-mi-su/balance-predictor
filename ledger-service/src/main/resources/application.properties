# ==============================
# Ledger Service Configuration
# ==============================
spring.application.name=ledger-service
server.port=8082

management.server.port=8082
management.endpoints.web.exposure.include=*

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# ==============================
# Eureka / Service Discovery
# ==============================
eureka.client.service-url.defaultZone=${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka}
eureka.instance.prefer-ip-address=true
eureka.client.healthcheck.enabled=true

# ==============================
# Datasource (Postgres)
# ==============================
# Use the docker service host ("postgres") by default so compose works OOTB.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/bpdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:bpuser}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:bppass}
spring.datasource.hikari.maximum-pool-size=10

# ==============================
# JPA / Hibernate
# ==============================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
# (Optional; Hibernate will pick the correct dialect automatically on PG 16)
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.default_schema=public

# ==============================
# Flyway
# ==============================
spring.flyway.enabled=true
# Reuse the datasource
spring.flyway.url=${SPRING_FLYWAY_URL:${spring.datasource.url}}
spring.flyway.user=${SPRING_FLYWAY_USER:${spring.datasource.username}}
spring.flyway.password=${SPRING_FLYWAY_PASSWORD:${spring.datasource.password}}

# Point to SQLs and schema
spring.flyway.locations=classpath:db/migration
spring.flyway.default-schema=public

# Dedicated history table per service (isolates from Plaid's history)
spring.flyway.table=flyway_schema_history_ledger

# --- IMPORTANT BEHAVIOR ---
# Baseline ONLY when the schema is non-empty and there is no history table,
# but baseline at 0 so that V1 still runs (fixes "missing pending_events").
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# Safety
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true
