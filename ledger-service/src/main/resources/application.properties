# ==============================
# Ledger Service Configuration
# ==============================
spring.application.name=ledger-service
server.port=8082

management.server.port=8082
management.endpoints.web.exposure.include=*

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# ==============================
# Eureka / Service Discovery
# ==============================
eureka.client.service-url.defaultZone=${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka}
eureka.instance.prefer-ip-address=true
eureka.client.healthcheck.enabled=true

# ==============================
# Datasource (Postgres)
# ==============================
# Default to the Docker service host ("postgres") so it works in compose without extra env.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/bpdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:bpuser}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:bppass}
spring.datasource.hikari.maximum-pool-size=10

# ==============================
# JPA / Hibernate
# ==============================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.default_schema=public

# ==============================
# Flyway
# ==============================
spring.flyway.enabled=true
# Reuse the datasource connection
spring.flyway.url=${SPRING_FLYWAY_URL:${spring.datasource.url}}
spring.flyway.user=${SPRING_FLYWAY_USER:${spring.datasource.username}}
spring.flyway.password=${SPRING_FLYWAY_PASSWORD:${spring.datasource.password}}

spring.flyway.locations=classpath:db/migration
spring.flyway.default-schema=public
# Dedicated history table per service (prevents clashes with other services)
spring.flyway.table=flyway_schema_history_ledger

# Let V1 run on a fresh DB; do NOT baseline new databases
spring.flyway.baseline-on-migrate=false
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true
